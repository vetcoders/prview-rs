name: prview gate

on:
  push:
    branches: [main, feat/gate-core, feat/gate-packaging]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94"

permissions:
  contents: read

jobs:
  gate-shadow:
    name: Gate Shadow
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      sarif_available: ${{ steps.gate.outputs.sarif_available }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned master snapshot verified 2026-09-14; supports Rust branches through 1.120.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Build prview from source
        run: cargo build --locked --release
      - name: Run prview gate
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          runner_temp="${RUNNER_TEMP:-/tmp}"
          json_path="${runner_temp}/prview-gate.json"

          # A push to the default branch checks out the pushed tip, so base
          # auto-detection resolves main == target and reviews an empty change.
          # Review the delivered range instead: the pre-push commit is the base,
          # and --exact-base keeps it literal. Without it the base would be
          # normalized to its merge-base with the tip, which equals the pre-push
          # commit on a fast-forward but widens the review on a force-push.
          gate_args=()
          base_row="auto-detected, normalized to the merge-base"
          if [ "$EVENT_NAME" != "push" ]; then
            base_row="auto-detected (${EVENT_NAME} event), normalized to the merge-base"
          elif [ -z "$PUSH_BEFORE" ] || [ -z "${PUSH_BEFORE//0/}" ]; then
            base_row="auto-detected (new branch push, no pre-push commit), normalized to the merge-base"
          elif ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base_row="auto-detected (pre-push commit \`${PUSH_BEFORE}\` unavailable), normalized to the merge-base"
          else
            gate_args=(--base "$PUSH_BEFORE" --exact-base)
            # The object is present (checked above), so this is a local lookup.
            if git merge-base --is-ancestor "$PUSH_BEFORE" HEAD 2>/dev/null; then
              push_shape="fast-forward push"
            else
              push_shape="force-push, so this is the delivered range, not the merge-base superset"
            fi
            base_row="\`${PUSH_BEFORE}\` (pre-push commit), exact range \`${PUSH_BEFORE}..HEAD\` (${push_shape})"
          fi

          set +e
          ./target/release/prview gate "${gate_args[@]}" --json > "$json_path"
          status=$?
          set -e

          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          echo "json_path=${json_path}" >> "$GITHUB_OUTPUT"

          verdict=""
          enforcement_disposition=""
          output_dir=""
          sarif_path=""
          if command -v jq >/dev/null 2>&1 && [ -s "$json_path" ]; then
            verdict="$(jq -r '.verdict // empty' "$json_path" 2>/dev/null || true)"
            enforcement_disposition="$(jq -r '.enforcement_disposition // empty' "$json_path" 2>/dev/null || true)"
            output_dir="$(jq -r '.output_dir // empty' "$json_path" 2>/dev/null || true)"
          fi

          if [ -n "$output_dir" ] && [ -f "${output_dir}/30_context/INLINE_FINDINGS.sarif" ]; then
            sarif_path="${output_dir}/30_context/INLINE_FINDINGS.sarif"
          fi
          echo "sarif_path=${sarif_path}" >> "$GITHUB_OUTPUT"
          if [ -n "$sarif_path" ]; then
            echo "sarif_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_available=false" >> "$GITHUB_OUTPUT"
          fi

          case "$status" in
            0) result="PASS, advisory CONDITIONAL, or accepted typed warnings-only" ;;
            1) result="BLOCK" ;;
            2) result="strict review-required or warning-clean rejection" ;;
            3) result="internal gate execution error" ;;
            *) result="unexpected exit code" ;;
          esac

          {
            echo "## prview gate shadow"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Mode | shadow / non-strict |"
            echo "| Decision source | exit code only |"
            echo "| Base | ${base_row} |"
            echo "| Exit code | \`${status}\` |"
            echo "| Result | ${result} |"
            if [ -n "$verdict" ]; then
              echo "| JSON verdict | \`${verdict}\` |"
            fi
            if [ -n "$enforcement_disposition" ]; then
              echo "| Enforcement disposition | \`${enforcement_disposition}\` |"
            fi
            if [ -n "$sarif_path" ]; then
              echo "| SARIF | \`${sarif_path}\` |"
            else
              echo "| SARIF | not produced for this run |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
      - name: Stage constrained SARIF artifact
        if: ${{ steps.gate.outputs.sarif_path != '' }}
        env:
          SARIF_SOURCE: ${{ steps.gate.outputs.sarif_path }}
        run: |
          install -d "$RUNNER_TEMP/prview-sarif"
          cp -- "$SARIF_SOURCE" "$RUNNER_TEMP/prview-sarif/INLINE_FINDINGS.sarif"
      - name: Upload constrained SARIF artifact
        if: ${{ steps.gate.outputs.sarif_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: prview-inline-sarif-${{ github.run_id }}
          path: ${{ runner.temp }}/prview-sarif/INLINE_FINDINGS.sarif
          if-no-files-found: error
          retention-days: 1

  upload-sarif:
    name: Upload trusted SARIF
    needs: gate-shadow
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate-shadow.outputs.sarif_available == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download constrained SARIF artifact
        uses: actions/download-artifact@v8
        with:
          name: prview-inline-sarif-${{ github.run_id }}
          path: ${{ runner.temp }}/prview-sarif
      - name: Validate constrained SARIF artifact
        shell: bash
        run: |
          sarif="$RUNNER_TEMP/prview-sarif/INLINE_FINDINGS.sarif"
          test -f "$sarif"
          test ! -L "$sarif"
          test "$(wc -c < "$sarif")" -le 10485760
          jq -e '.version == "2.1.0" and (.runs | type == "array")' "$sarif" >/dev/null
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/prview-sarif/INLINE_FINDINGS.sarif
          category: prview-inline
