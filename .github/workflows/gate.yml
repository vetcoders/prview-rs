name: prview gate

on:
  push:
    branches: [main, feat/gate-core, feat/gate-packaging]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94"

permissions:
  contents: read

jobs:
  gate-shadow:
    name: Gate Shadow
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      sarif_available: ${{ steps.gate.outputs.sarif_available }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned master snapshot verified 2026-09-04; supports Rust branches through 1.120.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Test gate evidence contract
        run: python3 -m unittest discover -s tools/tests -p 'test_gate_shadow_receipt.py'
      - name: Build prview from source
        shell: bash
        run: PRVIEW_SOURCE_SHA="$(git rev-parse HEAD)" cargo build --locked --release
      - name: Run prview gate
        id: gate
        shell: bash
        run: |
          runner_temp="${RUNNER_TEMP:-/tmp}"
          json_path="${runner_temp}/prview-gate.json"
          stderr_path="${runner_temp}/prview-gate.stderr.log"
          receipt_path="${runner_temp}/prview-gate-receipt.json"
          source_sha="$(./target/release/prview --build-source-sha)"
          checkout_sha="$(git rev-parse HEAD)"

          set +e
          ./target/release/prview gate --json > "$json_path" 2> "$stderr_path"
          status=$?
          set -e
          cat "$stderr_path" >&2

          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          echo "json_path=${json_path}" >> "$GITHUB_OUTPUT"

          verdict=""
          json_exit_code=""
          enforcement_disposition=""
          output_dir=""
          sarif_path=""
          if command -v jq >/dev/null 2>&1 && [ -s "$json_path" ]; then
            verdict="$(jq -r '.verdict // empty' "$json_path" 2>/dev/null || true)"
            json_exit_code="$(jq -r '.exit_code | select(type == "number")' "$json_path" 2>/dev/null || true)"
            enforcement_disposition="$(jq -r '.enforcement_disposition // empty' "$json_path" 2>/dev/null || true)"
            output_dir="$(jq -r '.output_dir // empty' "$json_path" 2>/dev/null || true)"
          fi

          jq -n --arg source_sha "$source_sha" --arg checkout_sha "$checkout_sha" \
            --argjson process_exit_code "$status" --argjson json_exit_code "${json_exit_code:-null}" \
            '{schema_version: "gate-shadow-receipt/v1", build_source_sha: $source_sha,
              checkout_sha: $checkout_sha, process_exit_code: $process_exit_code,
              json_exit_code: $json_exit_code,
              source_matches_checkout: ($source_sha == $checkout_sha),
              exit_matches_json: (if $json_exit_code == null then null
                                  else $process_exit_code == $json_exit_code end)}' > "$receipt_path"
          source_matches_checkout="$(jq -r '.source_matches_checkout' "$receipt_path")"
          exit_matches_json="$(jq -r 'if .exit_matches_json == null then "unavailable" else .exit_matches_json end' "$receipt_path")"

          if [ -n "$output_dir" ] && [ -f "${output_dir}/30_context/INLINE_FINDINGS.sarif" ]; then
            sarif_path="${output_dir}/30_context/INLINE_FINDINGS.sarif"
          fi
          echo "sarif_path=${sarif_path}" >> "$GITHUB_OUTPUT"
          if [ -n "$sarif_path" ]; then
            echo "sarif_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_available=false" >> "$GITHUB_OUTPUT"
          fi

          case "$status" in
            0) result="PASS, advisory CONDITIONAL, or accepted typed warnings-only" ;;
            1) result="BLOCK" ;;
            2) result="strict review-required or warning-clean rejection" ;;
            3) result="internal gate execution error" ;;
            130) result="operator cancellation; no verdict" ;;
            *) result="unexpected exit code" ;;
          esac

          {
            echo "## prview gate shadow"
            echo
            echo "Shadow success is not a PASS verdict. This job records the gate result without enforcing it."
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Mode | shadow / non-strict |"
            echo "| Decision source | exit code only |"
            echo "| Exit code | \`${status}\` |"
            echo "| JSON exit code | \`${json_exit_code:-unavailable}\` |"
            echo "| Exit matches JSON | \`${exit_matches_json}\` |"
            echo "| Build source SHA | \`${source_sha}\` |"
            echo "| Checkout SHA | \`${checkout_sha}\` |"
            echo "| Source matches checkout | \`${source_matches_checkout}\` |"
            echo "| Result | ${result} |"
            if [ -n "$verdict" ]; then
              echo "| JSON verdict | \`${verdict}\` |"
            fi
            if [ -n "$enforcement_disposition" ]; then
              echo "| Enforcement disposition | \`${enforcement_disposition}\` |"
            fi
            if [ -n "$sarif_path" ]; then
              echo "| SARIF | \`${sarif_path}\` |"
            else
              echo "| SARIF | not produced for this run |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
      - name: Upload gate evidence
        if: ${{ always() && steps.gate.outputs.json_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prview-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/prview-gate.json
            ${{ runner.temp }}/prview-gate.stderr.log
            ${{ runner.temp }}/prview-gate-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Stage constrained SARIF artifact
        if: ${{ steps.gate.outputs.sarif_path != '' }}
        env:
          SARIF_SOURCE: ${{ steps.gate.outputs.sarif_path }}
        run: |
          install -d "$RUNNER_TEMP/prview-sarif"
          cp -- "$SARIF_SOURCE" "$RUNNER_TEMP/prview-sarif/INLINE_FINDINGS.sarif"
      - name: Upload constrained SARIF artifact
        if: ${{ steps.gate.outputs.sarif_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: prview-inline-sarif-${{ github.run_id }}
          path: ${{ runner.temp }}/prview-sarif/INLINE_FINDINGS.sarif
          if-no-files-found: error
          retention-days: 1

  upload-sarif:
    name: Upload trusted SARIF
    needs: gate-shadow
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate-shadow.outputs.sarif_available == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download constrained SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: prview-inline-sarif-${{ github.run_id }}
          path: ${{ runner.temp }}/prview-sarif
      - name: Validate constrained SARIF artifact
        shell: bash
        run: |
          sarif="$RUNNER_TEMP/prview-sarif/INLINE_FINDINGS.sarif"
          test -f "$sarif"
          test ! -L "$sarif"
          test "$(wc -c < "$sarif")" -le 10485760
          jq -e '.version == "2.1.0" and (.runs | type == "array")' "$sarif" >/dev/null
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/prview-sarif/INLINE_FINDINGS.sarif
          category: prview-inline
