name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Toolchain pinned to match local dev (1.94.x). The earlier 1.92.0 pin
  # worked around report-leptos (transitive via loctree) hitting query-depth
  # limits on Rust 1.93+; that no longer reproduces — the full release build
  # and test suite compile clean on 1.94.x.
  RUST_TOOLCHAIN: "1.94"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  windows-process-tree:
    name: Windows process-tree cancellation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Prove governor first-cancel and late-registration trees
        run: cargo test --lib governor::tests::windows_cancellation_reaps_first_cancel_and_late_registration_trees -- --exact

  ordinary-machine-resource-acceptance:
    name: Ordinary-machine bounded deep review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRVIEW_ACCEPTANCE_DIR: ${{ github.workspace }}/prview-resource-acceptance
      PRVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRVIEW_SOURCE_SHA }}
      - name: Initialize failure-shaped receipt
        run: |
          python3 tools/bounded_runtime_acceptance.py \
            --initialize-only \
            --receipt-dir "$PRVIEW_ACCEPTANCE_DIR" \
            --source-sha "$PRVIEW_SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/fixtures/bounded-runtime/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the real Semgrep scanner
        run: python -m pip install --disable-pip-version-check semgrep==1.175.0
      - name: Build the candidate release binary
        run: timeout 900 cargo build --release --locked
      - name: Exercise the full mixed-tool deep review
        run: |
          python3 tools/bounded_runtime_acceptance.py \
            --binary "$GITHUB_WORKSPACE/target/release/prview" \
            --fixture "$GITHUB_WORKSPACE/tools/fixtures/bounded-runtime" \
            --receipt-dir "$PRVIEW_ACCEPTANCE_DIR" \
            --source-sha "$PRVIEW_SOURCE_SHA" \
            --timeout-seconds 1200
      - name: Upload bounded-runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-machine-resource-acceptance-${{ env.PRVIEW_SOURCE_SHA }}
          path: ${{ env.PRVIEW_ACCEPTANCE_DIR }}
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: prview-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/prview

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v4
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # WHY: quick-xml 0.39 sits in Cargo.lock only through comrak's target-gated (wasm) syntect variant; it is NOT part of the build graph on any release target (proof: cargo tree -i quick-xml empty on x86_64-unknown-linux-gnu and aarch64-apple-darwin) and prview parses no external XML.
      # WHEN TO REMOVE: when plist releases quick-xml >=0.41 support (RUSTSEC-2026-0194/0195 patched there) — bump the chain and drop this ignore.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
